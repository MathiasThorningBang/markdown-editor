<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="editor.bundle.css">
  <style>
    /* NM design system tokens */
    :root {
      --color-primary: #df475c;
      --color-background: #ffffff;
      --color-foreground: #171717;
      --color-card: #f7f7f7;
      --color-muted: #f5f5f5;
      --color-muted-foreground: #a3a3a3;
      --color-secondary-foreground: #525252;
      --color-border: #e5e5e5;
      --color-nm-blue: #2e7ab5;

      /* Defaults; Swift overrides all three from Settings → fonts */
      --font-heading: 'DM Sans', system-ui, sans-serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'Geist Mono', monospace;

      color-scheme: light dark;
    }

    /* Dark tokens, modeled on the Codex app's dark theme: soft #181818
       background, raised #212121 surfaces. NM blue is lifted for contrast.
       --color-primary is the user's accent, set from Swift (Settings). */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background: #181818;
        --color-foreground: #ffffff;
        --color-card: #212121;
        --color-muted: #2a2a2a;
        --color-muted-foreground: #8a8a8a;
        --color-secondary-foreground: #b4b4b4;
        --color-border: #2e2e2e;
        --color-nm-blue: #5b9bd5;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--color-background);
      -webkit-font-smoothing: antialiased;
    }

    #editor {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 120px;
      font-size: 16px;
    }

    /* Map Crepe theme variables to NM tokens */
    .milkdown {
      --crepe-font-title: var(--font-heading);
      --crepe-font-default: var(--font-body);
      --crepe-font-code: var(--font-mono);

      --crepe-color-background: var(--color-background);
      --crepe-color-on-background: var(--color-foreground);
      --crepe-color-surface: var(--color-card);
      --crepe-color-surface-low: var(--color-muted);
      --crepe-color-on-surface: var(--color-foreground);
      --crepe-color-on-surface-variant: var(--color-secondary-foreground);
      --crepe-color-outline: var(--color-muted-foreground);
      --crepe-color-primary: var(--color-primary);
      --crepe-color-secondary: var(--color-border);
      --crepe-color-on-secondary: var(--color-foreground);
      --crepe-color-inverse: var(--color-muted);
      --crepe-color-on-inverse: var(--color-foreground);
      --crepe-color-inline-code: var(--color-foreground);
      --crepe-color-inline-area: var(--color-muted);
      --crepe-color-error: var(--color-primary);
      --crepe-color-hover: var(--color-muted);
      --crepe-color-selected: color-mix(in srgb, var(--color-primary) 22%, transparent);

      font-size: 16px;
      caret-color: var(--color-primary);
    }

    /* Text rhythm: 16px body on a 26px line */
    .milkdown .ProseMirror p {
      line-height: 26px;
    }

    /* Calm document scale. Crepe's reset uses `.milkdown .ProseMirror h1 { font-weight: 400 }`
       and a 42→18px scale — match its specificity. Space above separates sections,
       the following paragraph's padding is the only space below. */
    .milkdown .ProseMirror h1, .milkdown .ProseMirror h2, .milkdown .ProseMirror h3,
    .milkdown .ProseMirror h4, .milkdown .ProseMirror h5, .milkdown .ProseMirror h6 {
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0;
    }
    .milkdown .ProseMirror h1 { font-size: 32px; line-height: 40px; margin-top: 40px; letter-spacing: -0.02em; }
    .milkdown .ProseMirror h2 { font-size: 24px; line-height: 32px; margin-top: 36px; }
    .milkdown .ProseMirror h3 { font-size: 20px; line-height: 28px; margin-top: 28px; }
    .milkdown .ProseMirror h4 { font-size: 18px; line-height: 26px; margin-top: 24px; }
    .milkdown .ProseMirror h5 { font-size: 16px; line-height: 24px; margin-top: 20px; }
    .milkdown .ProseMirror h6 {
      font-size: 16px; line-height: 24px; margin-top: 20px;
      font-weight: 600; color: var(--color-secondary-foreground);
    }
    .milkdown .ProseMirror > :first-child { margin-top: 0; }

    /* Links in NM blue — Crepe colors `.milkdown .ProseMirror a` with primary, so match that */
    .milkdown .ProseMirror a {
      color: var(--color-nm-blue);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    /* Inline code: quiet gray chip, not a second accent color */
    .milkdown .ProseMirror code {
      padding: 0 5px;
      border-radius: 4px;
      background: var(--color-muted);
    }

    /* Blocks get room to breathe instead of sitting flush against each other */
    .milkdown .milkdown-code-block {
      margin: 16px 0;
      padding: 4px 16px 12px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
    }
    .milkdown .milkdown-code-block .cm-editor {
      font-size: 14px;
    }
    .milkdown .milkdown-code-block .cm-scroller {
      font-family: var(--font-mono);
    }
    .milkdown .milkdown-table-block {
      margin: 16px 0;
    }
    .milkdown .milkdown-table-block th,
    .milkdown .milkdown-table-block td {
      border-color: var(--color-border);
      padding: 8px 12px;
    }
    .milkdown .milkdown-table-block th p,
    .milkdown .milkdown-table-block td p {
      padding: 0;
    }
    .milkdown .milkdown-list-item-block p {
      padding: 2px 0;
    }
    .milkdown .milkdown-table-block th {
      background: var(--color-card);
      font-weight: 600;
    }
    .milkdown .ProseMirror hr {
      margin: 24px 0;
      height: 1px;
      padding: 0;
      background-color: var(--color-border);
    }

    /* Rendered ```html and ```mermaid blocks (editor/src/preview.js) */
    .milkdown .md-preview-html iframe {
      display: block;
      width: 100%;
      border: 0;
    }
    .milkdown .md-preview-mermaid svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    /* Mermaid draws timeline axes in the text color; soften them.
       !important: Mermaid's own rules are scoped to the diagram's id. */
    .milkdown .md-preview-mermaid .lineWrapper line {
      stroke: var(--color-muted-foreground) !important;
    }
    .milkdown .md-preview-error {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 13px;
      white-space: pre-wrap;
      text-align: left;
      color: var(--color-secondary-foreground);
    }

    /* Checked task boxes carry the accent */
    .milkdown .milkdown-list-item-block .label.checked svg {
      fill: var(--color-primary);
    }

    /* Blockquote: thin rule, modest indent, secondary text */
    .milkdown .ProseMirror blockquote {
      padding-left: 20px;
      margin: 12px 0;
      color: var(--color-secondary-foreground);
    }
    .milkdown .ProseMirror blockquote:before {
      width: 3px;
      background: var(--color-border);
    }

    /* While Cmd is held, links and path-like inline code show they can be opened (Cmd+click) */
    body.cmd-held .milkdown a {
      cursor: pointer;
    }
    body.cmd-held .milkdown code.path-code {
      cursor: pointer;
      text-decoration: underline;
    }

    /* Images span the full text container width.
       Crepe's image component sets an inline height (naturalHeight × resize-ratio)
       after load — override it, or object-fit letterboxes the image at natural size. */
    .milkdown .milkdown-image-block > .image-wrapper {
      width: 100%;
    }
    .milkdown .milkdown-image-block > .image-wrapper img {
      width: 100%;
      height: auto !important;
      min-height: 0 !important;
      object-fit: contain;
    }
    /* The drag-to-resize handle is pointless when images are always full width */
    .milkdown .milkdown-image-block .image-resize-handle {
      display: none;
    }

    /* Breakout layout: text keeps a reading width, while tables and rendered
       ```html/```mermaid blocks use the full column. #editor beats Crepe's and
       our own block margins; narrow windows collapse both to the same width. */
    .milkdown .ProseMirror {
      padding-left: 80px;
      padding-right: 80px;
    }
    #editor .ProseMirror > * {
      box-sizing: border-box;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }
    #editor .ProseMirror > .milkdown-table-block,
    #editor .ProseMirror > .milkdown-code-block:has(.md-preview-slot) {
      max-width: none;
    }

    /* Read aloud: the sentence being spoken, one mark per line (window.readAloudHighlight below) */
    .read-aloud-mark {
      position: absolute;
      border-radius: 3px;
      background: color-mix(in srgb, var(--color-primary) 18%, transparent);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="editor.bundle.js"></script>
  <script>
    // Read aloud (Speech/ReadAloud.swift) highlights the sentence being spoken.
    // The spoken text has lost markup, emoji and ChatGPT's 【…】 citations, so
    // both sides are matched on letters and digits only. The marks are
    // positioned over the page, outside the editor, so the document itself is
    // untouched. (CSS Custom Highlights left stale highlights painted.)
    (() => {
      const alnum = /[\p{L}\p{N}]/u
      let cursor = 0
      let current = null
      const marks = document.createElement('div')
      document.body.append(marks)

      // One mark per line (per cell in tables) of the range, measured per text node so inline
      // elements like <em> don't add overlapping boxes.
      function draw() {
        marks.replaceChildren()
        if (!current) return
        const lines = []
        const root = current.commonAncestorContainer
        const nodes = []
        if (root.nodeType === Node.TEXT_NODE) nodes.push(root)
        else {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT)
          for (let node; (node = walker.nextNode()); ) if (current.intersectsNode(node)) nodes.push(node)
        }
        for (const node of nodes) {
          const part = document.createRange()
          part.setStart(node, node === current.startContainer ? current.startOffset : 0)
          part.setEnd(node, node === current.endContainer ? current.endOffset : node.length)
          for (const r of part.getClientRects()) {
            if (r.width < 1) continue
            // Same line and touching: one mark. Table cells side by side stay apart.
            const line = lines.find((l) => Math.abs(l.top - r.top) < 4 && Math.abs(l.bottom - r.bottom) < 4
              && r.left <= l.right + 8 && r.right >= l.left - 8)
            if (line) {
              line.left = Math.min(line.left, r.left)
              line.right = Math.max(line.right, r.right)
            } else {
              lines.push({ top: r.top, bottom: r.bottom, left: r.left, right: r.right })
            }
          }
        }
        for (const l of lines) {
          const mark = document.createElement('div')
          mark.className = 'read-aloud-mark'
          mark.style.left = `${l.left + scrollX - 2}px`
          mark.style.top = `${l.top + scrollY}px`
          mark.style.width = `${l.right - l.left + 4}px`
          mark.style.height = `${l.bottom - l.top}px`
          marks.append(mark)
        }
      }
      addEventListener('resize', draw)

      // Every letter and digit in the editor, with the text node it sits in.
      function index() {
        const root = document.querySelector('#editor .ProseMirror')
        const chars = []
        const spots = []
        if (!root) return { text: '', spots }
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT)
        let inCitation = false
        for (let node; (node = walker.nextNode()); ) {
          if (node.parentElement.closest('.milkdown-code-block')) continue
          for (let i = 0; i < node.data.length; i++) {
            const c = node.data[i]
            if (c === '【') inCitation = true
            else if (c === '】') inCitation = false
            else if (!inCitation && alnum.test(c)) {
              chars.push(c.toLowerCase())
              spots.push([node, i])
            }
          }
        }
        return { text: chars.join(''), spots }
      }

      // Where in `text` each sentence is, matched forward like the highlight; -1 if not on the page.
      function locate(sentences, text) {
        let from = 0
        return sentences.map((sentence) => {
          let key = [...sentence.toLowerCase()].filter((c) => alnum.test(c)).join('')
          let at = key ? text.indexOf(key, from) : -1
          if (at < 0 && /^\d/.test(key)) {
            key = key.replace(/^\d+/, '')
            at = key ? text.indexOf(key, from) : -1
          }
          if (at < 0) return { at: -1, end: -1 }
          from = at + key.length
          return { at, end: from }
        })
      }

      // The sentence the cursor (or the selection's start) is in or just before, for
      // reading from there. 0 when the cursor is at the top or after the last sentence.
      window.readAloudStart = (sentences) => {
        const { text, spots } = index()
        const selection = getSelection()
        const root = document.querySelector('#editor .ProseMirror')
        if (!selection.rangeCount || !root || !root.contains(selection.anchorNode)) return 0
        const caret = selection.getRangeAt(0)
        // First letter or digit at or after the cursor.
        let char = spots.findIndex(([node, offset]) => caret.comparePoint(node, offset) >= 0)
        if (char < 0) char = text.length
        const places = locate(sentences, text)
        const found = places.findIndex((place) => place.end > char)
        if (found < 0) return 0
        cursor = places[found].at
        return found
      }

      window.readAloudHighlight = (sentence) => {
        if (sentence == null) {
          current = null
          cursor = 0
          draw()
          return
        }
        const { text, spots } = index()
        let key = [...sentence.toLowerCase()].filter((c) => alnum.test(c)).join('')
        // Reading moves forward, so look after the last sentence first.
        let at = text.indexOf(key, cursor)
        if (at < 0) at = text.indexOf(key)
        // Numbered list items are spoken with their number; the editor draws it as a marker.
        if (at < 0 && /^\d/.test(key)) {
          key = key.replace(/^\d+/, '')
          at = text.indexOf(key, cursor)
        }
        if (at < 0 || !key) {
          // Not on the page (a skipped code block): don't leave the last sentence marked.
          current = null
          draw()
          return
        }
        cursor = at + key.length
        const [startNode, startOffset] = spots[at]
        const [endNode, endOffset] = spots[at + key.length - 1]
        const range = new Range()
        range.setStart(startNode, startOffset)
        range.setEnd(endNode, endOffset + 1)
        current = range
        draw()
        const rect = range.getBoundingClientRect()
        if (rect.top < 80 || rect.bottom > innerHeight - 80) {
          scrollBy({ top: rect.top - innerHeight / 3, behavior: 'smooth' })
        }
      }
    })()
  </script>
</body>
</html>
