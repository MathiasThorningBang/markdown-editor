<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Kurv</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--color-background);color:var(--color-foreground);font-family:var(--font-body);font-size:16px}
.screen{max-width:390px;min-height:100vh;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0}
h1{margin:0;font-size:24px;line-height:1.25}
.count{font-family:var(--font-mono);font-size:16px;color:var(--color-muted-foreground)}
.card{background:var(--color-card);border:1px solid var(--color-border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px}
.thumb{width:64px;height:64px;border-radius:8px;background:var(--color-muted);border:1px solid var(--color-border)}
.name{margin:0;font-size:16px;font-weight:600}
.variant{margin:2px 0 0;font-size:16px;color:var(--color-muted-foreground)}
.line{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--color-border);border-radius:8px;overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:var(--color-background);color:var(--color-foreground);font:inherit;font-size:16px;cursor:pointer}
.stepper output{min-width:36px;text-align:center;font-family:var(--font-mono);font-size:16px}
.price{font-family:var(--font-mono);font-size:16px;font-weight:600}
hr{border:0;border-top:1px solid var(--color-border);margin:0}
.sum{display:flex;justify-content:space-between;font-size:16px}
.sum span:first-child{color:var(--color-secondary-foreground)}
.note{margin:0;font-size:16px;color:var(--color-muted-foreground)}
.cta{margin-top:auto;width:100%;height:52px;border:0;border-radius:8px;background:var(--color-primary);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.cta:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
</style>
</head>
<body>
<main class="screen">
  <header><h1>Kurv</h1><span class="count" id="count">3 varer</span></header>

  <section class="card" aria-label="Varer i kurven">
    <article class="item">
      <div class="thumb" aria-hidden="true"></div>
      <div>
        <p class="name">Keramikkrus</p>
        <p class="variant">Sand, 0,35 l</p>
        <div class="line">
          <div class="stepper"><button type="button" data-step="-1" aria-label="Færre">−</button><output data-qty>1</output><button type="button" data-step="1" aria-label="Flere">+</button></div>
          <span class="price" data-price="349">349 kr.</span>
        </div>
      </div>
    </article>
    <hr>
    <article class="item">
      <div class="thumb" aria-hidden="true"></div>
      <div>
        <p class="name">Linnedpose</p>
        <p class="variant">Natur, medium</p>
        <div class="line">
          <div class="stepper"><button type="button" data-step="-1" aria-label="Færre">−</button><output data-qty>2</output><button type="button" data-step="1" aria-label="Flere">+</button></div>
          <span class="price" data-price="129">258 kr.</span>
        </div>
      </div>
    </article>
    <hr>
    <article class="item">
      <div class="thumb" aria-hidden="true"></div>
      <div>
        <p class="name">Træskål</p>
        <p class="variant">Eg, 20 cm</p>
        <div class="line">
          <div class="stepper"><button type="button" data-step="-1" aria-label="Færre">−</button><output data-qty>1</output><button type="button" data-step="1" aria-label="Flere">+</button></div>
          <span class="price" data-price="249">249 kr.</span>
        </div>
      </div>
    </article>
  </section>

  <section class="card" aria-label="Oversigt">
    <div class="sum"><span>Subtotal</span><strong id="subtotal" style="font-family:var(--font-mono)">856 kr.</strong></div>
    <p class="note">Levering beregnes i næste trin.</p>
  </section>

  <button class="cta" type="button">Gå til levering</button>
</main>
<script>
const unit = { 0: 349, 1: 129, 2: 249 };
const items = [...document.querySelectorAll('.item')];
function recalc() {
  let total = 0, count = 0;
  items.forEach((item, i) => {
    const qty = Number(item.querySelector('[data-qty]').value ?? item.querySelector('[data-qty]').textContent);
    const line = unit[i] * qty;
    item.querySelector('.price').textContent = line + ' kr.';
    total += line; count += qty;
  });
  document.getElementById('subtotal').textContent = total + ' kr.';
  document.getElementById('count').textContent = count + (count === 1 ? ' vare' : ' varer');
}
document.querySelectorAll('[data-step]').forEach(btn => {
  btn.addEventListener('click', () => {
    const out = btn.parentElement.querySelector('[data-qty]');
    const next = Math.max(1, Number(out.textContent) + Number(btn.dataset.step));
    out.textContent = next;
    recalc();
  });
});
</script>
</body>
</html>
