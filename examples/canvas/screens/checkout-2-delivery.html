<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Levering</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--color-background);color:var(--color-foreground);font-family:var(--font-body);font-size:16px}
.screen{max-width:390px;min-height:100vh;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
header{padding:8px 0 0}
.steps{font-family:var(--font-mono);font-size:16px;color:var(--color-muted-foreground);margin:0}
h1{margin:4px 0 0;font-size:24px;line-height:1.25}
.card{background:var(--color-card);border:1px solid var(--color-border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-size:16px;font-weight:600}
label{display:block;font-size:16px;font-weight:500;margin-bottom:6px}
input{display:block;width:100%;height:48px;padding:0 14px;font:inherit;font-size:16px;color:var(--color-foreground);background:var(--color-background);border:1px solid var(--color-border);border-radius:8px}
input:focus{outline:2px solid var(--color-primary);outline-offset:1px}
.grid{display:grid;grid-template-columns:100px 1fr;gap:12px}
.field{min-width:0}
.option{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:12px;padding:14px;border:1px solid var(--color-border);border-radius:12px;background:var(--color-background);cursor:pointer}
.option:has(input:checked){border-color:var(--color-primary);box-shadow:0 0 0 1px var(--color-primary)}
.option input{width:20px;height:20px;margin:0;accent-color:var(--color-primary)}
.option strong{display:block;font-size:16px;font-weight:600}
.option small{display:block;margin-top:2px;font-size:16px;color:var(--color-muted-foreground)}
.price{font-family:var(--font-mono);font-size:16px;font-weight:600}
.cta{margin-top:auto;width:100%;height:52px;border:0;border-radius:8px;background:var(--color-primary);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.cta:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
</style>
</head>
<body>
<main class="screen">
  <header>
    <p class="steps">Trin 2 af 3</p>
    <h1>Levering</h1>
  </header>

  <form class="card" action="#" onsubmit="return false">
    <h2>Leveringsadresse</h2>
    <div>
      <label for="name">Navn</label>
      <input id="name" autocomplete="name" placeholder="Fornavn og efternavn">
    </div>
    <div>
      <label for="street">Adresse</label>
      <input id="street" autocomplete="address-line1" placeholder="Vejnavn og nummer">
    </div>
    <div class="grid">
      <div class="field">
        <label for="zip">Postnr.</label>
        <input id="zip" inputmode="numeric" autocomplete="postal-code" placeholder="2100">
      </div>
      <div class="field">
        <label for="city">By</label>
        <input id="city" autocomplete="address-level2" placeholder="København Ø">
      </div>
    </div>
    <div>
      <label for="phone">Telefon <span style="color:var(--color-muted-foreground)">(valgfri)</span></label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="+45 00 00 00 00">
    </div>
  </form>

  <fieldset class="card" style="margin:0">
    <legend><h2>Fragtmetode</h2></legend>
    <label class="option">
      <input type="radio" name="delivery" value="pakkeshop" checked>
      <span><strong>Pakkeshop</strong><small>Hent på nærmeste pakkeshop, 2-3 hverdage</small></span>
      <span class="price">39 kr.</span>
    </label>
    <label class="option">
      <input type="radio" name="delivery" value="hjem">
      <span><strong>Hjemmelevering</strong><small>Leveres til døren, 1-2 hverdage</small></span>
      <span class="price">59 kr.</span>
    </label>
  </fieldset>

  <button class="cta" type="button">Gå til betaling</button>
</main>
</body>
</html>
