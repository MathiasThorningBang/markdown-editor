<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>Dashboard</title>
  <style>
    body { margin: 0; padding: 32px; background: var(--color-background); color: var(--color-foreground); font-family: var(--font-body); }
    h1 { font-size: 28px; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: 12px; padding: 16px; }
    .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--color-secondary-foreground); }
    .chart { position: relative; height: 240px; }
  </style>
</head>
<body>
  <h1>Projektoverblik</h1>
  <div class="grid">
    <div class="card"><h2>Timer pr. uge</h2><div class="chart"><canvas id="weeks"></canvas></div></div>
    <div class="card"><h2>Fordeling</h2><div class="chart"><canvas id="split"></canvas></div></div>
  </div>
  <script>
    new Chart(weeks, {
      type: 'line',
      data: { labels: ['41', '42', '43', '44'], datasets: [{ label: 'Timer', data: [32, 41, 38, 45] }] },
      options: { maintainAspectRatio: false }
    })
    new Chart(split, {
      type: 'doughnut',
      data: { labels: ['Strategi', 'Design', 'Udvikling'], datasets: [{ data: [20, 35, 45] }] },
      options: { maintainAspectRatio: false }
    })
  </script>
</body>
</html>
